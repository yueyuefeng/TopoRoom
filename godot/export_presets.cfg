; Template Godot 4.3 Android export preset.
; Architectures must match libraries listed in toporoom.gdextension:
;   arm64-v8a  → libtoporoom.android.template_*.arm64.so  (phone Debug APK)
;   x86_64     → libtoporoom.android.template_*.x86_64.so  (emulator; opt-in)
;
; 每次构建升版本；签名固定.
; Bump with ./godot/scripts/bump_android_version.sh (also run by export_android_debug.sh).
; Debug keystore is godot/android/keystore/debug.keystore — do not regenerate.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.sceneir.json,*.glb"
exclude_filter="app/_legacy/*"
export_path="../build/toporoom-android-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="34"
plugins/TopoRoomMedia=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
keystore/debug="android/keystore/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
version/code=2
version/name="0.1.1"
package/unique_name="com.toporoom.godot"
package/name="拓间 TopoRoom"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=false
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
permissions/custom_permissions=PackedStringArray("android.permission.READ_MEDIA_IMAGES", "android.permission.VIBRATE")
permissions/internet=false
permissions/bluetooth=true
permissions/bluetooth_admin=true
permissions/camera=true
permissions/vibrate=true
permissions/read_external_storage=true
permissions/write_external_storage=true
