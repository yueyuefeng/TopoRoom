; TopoRoom companion hub — BLE GATT laser bridge (not a USB hub).
; Phone USB Host carries Track A DaBai DCW or Track B dual-RGB UVC.

[platformio]
default_envs = esp32-c3

[common]
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
monitor_speed = 115200
build_flags =
  -DTOPOROOM_HUB_FW_VERSION=\"0.1.0\"
  -DTOPOROOM_HUB_SKU=\"toporoom_hub_c3\"
  -DLASER_UART_BAUD=19200
  -DLASER_DIST_SCALE=1

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
build_flags =
  ${common.build_flags}
  -DLASER_UART_TX_PIN=4
  -DLASER_UART_RX_PIN=5
  -DLASER_EN_PIN=6
  -DBMI270_SDA_PIN=8
  -DBMI270_SCL_PIN=9

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
build_flags =
  ${common.build_flags}
  -DLASER_UART_TX_PIN=17
  -DLASER_UART_RX_PIN=18
  -DLASER_EN_PIN=6
  -DBMI270_SDA_PIN=8
  -DBMI270_SCL_PIN=9

; Radio bring-up without a UART laser module: measure notify is 1000 mm laser.
[env:esp32-c3-sim]
extends = env:esp32-c3
build_flags =
  ${env:esp32-c3.build_flags}
  -DTOPOROOM_LASER_SIM=1
